name: Refresh data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: docker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Capture current data version
        id: before
        run: echo "version=$(jq -r .version web/public/data/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        working-directory: pipeline
        run: |
          npm ci
          npm run build

      - name: Check for changes
        id: diff
        run: |
          # manifest.json's version hash is derived only from dataset bytes, not
          # generatedAt, so this only trips on an actual data change, not a rebuild.
          NEW=$(jq -r .version web/public/data/manifest.json)
          if [ "$NEW" != "${{ steps.before.outputs.version }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "caniparkhere-bot"
          git config user.email "bot@smeral.net"
          git add web/public/data
          git commit -m "Refresh zone data from Prague open data"

      - name: Push to Forgejo
        if: steps.diff.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Push to GitHub
        if: steps.diff.outputs.changed == 'true'
        run: |
          git push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/rsmeral/caniparkhere.git" HEAD:main
        env:
          GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
